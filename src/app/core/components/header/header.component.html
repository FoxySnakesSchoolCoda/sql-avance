<mat-toolbar class="header-toolbar" role="navigation">
  <div class="header-left">
    <button
      *ngIf="isHandset"
      mat-icon-button
      type="button"
      class="menu-button"
      aria-label="Ouvrir la navigation"
      (click)="onToggleMenu()"
    >
      <mat-icon fontIcon="menu"></mat-icon>
    </button>

    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <mat-icon fontIcon="favorite"></mat-icon>
      </div>
      <span class="brand-name">LoveBook</span>
    </div>
  </div>

  <div class="search-field-wrapper">
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix fontIcon="search"></mat-icon>
      <input matInput type="search" placeholder="Rechercher sur LoveBook" />
    </mat-form-field>
  </div>

  <ng-container *ngIf="theme$ | async as theme">
    <div class="header-actions">
      <button
        mat-icon-button
        type="button"
        aria-label="Consulter les notifications"
        matTooltip="Notifications"
        matBadge="3"
        matBadgeColor="accent"
        matBadgeSize="small"
      >
        <mat-icon fontIcon="notifications"></mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        aria-label="Ouvrir les messages"
        matTooltip="Messages"
      >
        <mat-icon fontIcon="chat_bubble"></mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        aria-label="Voir le profil"
        matTooltip="Profil"
      >
        <mat-icon fontIcon="account_circle"></mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        (click)="toggleTheme()"
        [matTooltip]="theme === 'dark' ? 'Mode clair' : 'Mode sombre'"
        [attr.aria-label]="theme === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
      >
        <mat-icon [fontIcon]="theme === 'dark' ? 'light_mode' : 'dark_mode'"></mat-icon>
      </button>
    </div>
  </ng-container>
</mat-toolbar>
